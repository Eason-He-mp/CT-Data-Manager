name: Build Windows 32-bit EXE

# 触发条件：当你推送到 main 分支，或者在 GitHub 网页上手动点击运行
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # 使用 GitHub 提供的最新 Windows 虚拟机
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python (32-bit)
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        # 关键设置：强制使用 32 位 Python，打包出的 exe 才能在 32 位 Windows 运行
        architecture: 'x86' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        # --noconsole: 运行时不显示黑色的 CMD 控制台窗口
        # --onefile: 打包成单文件 exe
        # --name: 指定输出的 exe 文件名
        pyinstaller --noconsole --onefile --name "ct data manager" ct data manager.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CT_Data_Stat_Tool_Windows_32bit
        # PyInstaller 默认会将生成的 exe 放在 dist 目录下
        path: dist/ct data manager.exe
